name: Deploy site to GitHub Pages

# This repository has GitHub Pages configured with build_type "workflow", which
# means the classic branch builder is disabled and only a workflow can publish.
# Without this file nothing is ever deployed (the last live deploy was 2022-10-29).
#
# The site is pre-rendered: generate locally with `python _build/build.py`, commit
# the HTML, and this workflow publishes the committed tree as-is. It therefore does
# not need Python, Ruby, Jekyll or any build step of its own.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # .git and .github are excluded by the action itself; everything else in the
      # checkout is exactly the published site (~193 MB of the 1 GB budget).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub occasionally answers "No artifacts named \"github-pages\" were found
      # for this workflow run" right after a successful upload: the artifact
      # metadata lags behind. The first retry therefore has to *wait* — retrying
      # one second later always hits the same stale metadata (that is how the
      # 2026-11-25 deploy failed twice and left the site on the previous build).
      - name: Wait for artifact metadata
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "deploy failed; waiting for artifact metadata to settle"
          sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait longer
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
