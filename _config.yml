user_description: I am looking for a fulltime engineer and PhD position now. I have just finished a year of research intern in UISEE(Nanjing) AI Center under the supervision of <a href="https://www.cis.upenn.edu/~jshi/">Prof. Jianbo Shi</a>. The work was mainly focused on high-level vision tasks like tracking (SOT and MOT) and relative navigation. Before that, I have received my Master degree in Computer Vision from Beijing Institue of technology advised by <a href="https://scholar.google.com/citations?user=Sl6TV7gAAAAJ&hl=en"> Prof. Yunde Jia </a> and <a href="https://sites.google.com/site/wuyuweibit/">Prof. Yuwei Wu </a>. My master thesis is mainly focused on the low-level vision tasks like stereo matching and monocular depth estimation. I received my Bachelor degree in Computer Science from the Ocean University of China.
