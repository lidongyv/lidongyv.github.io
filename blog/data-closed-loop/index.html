<script>
  const b64 = document.getElementById('md-b64').textContent.trim();
  const md = new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }));
  const container = document.getElementById('content');
  container.innerHTML = marked.parse(md);
  container.querySelectorAll('code.language-mermaid').forEach(function(code){
    const box = document.createElement('pre');
    box.className = 'mermaid';
    box.textContent = code.textContent;
    code.parentElement.replaceWith(box);
  });
  const toc = document.getElementById('toc');
  let n = 0;
  container.querySelectorAll('h2, h3').forEach(function(h){
    const id = 'sec-' + (n++);
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') { a.className = 'lvl3'; }
    a.addEventListener('click', function(e){ e.preventDefault(); document.getElementById(id).scrollIntoView({ behavior:'smooth' }); history.replaceState(null, '', '#' + id); });
    toc.appendChild(a);
  });
  mermaid.initialize({ startOnLoad:false, theme:'default', securityLevel:'loose', flowchart:{ htmlLabels:true, useMaxWidth:true } });
  mermaid.run({ querySelector:'.mermaid' });
  const links = Array.from(toc.querySelectorAll('a'));
  const heads = links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); });
  function onScroll(){
    let idx = 0;
    for (let i = 0; i < heads.length; i++){ if (heads[i].getBoundingClientRect().top <= 120) { idx = i; } }
    links.forEach(function(a, i){ a.classList.toggle('active', i === idx); });
  }
  document.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
</script>
