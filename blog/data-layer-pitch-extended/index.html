<html lang="zh-CN">
<head>

<title>还没有人拥有的那一层数据</title>
<style>
:root{
  color-scheme: light;
  --ink:#14161A; --ink2:#1F2329; --ink3:#2B3138;
  --paper:#FFFFFF; --paper2:#F2F3F5; --paper3:#E6E8EB;
  --touch:#FF5A36; --touchdim:#C23F22;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3A3D42;font-family:var(--sans);-webkit-font-smoothing:antialiased}

.slide{

  padding:52px 62px;display:none;flex-direction:column;

}
.slide.on{display:flex}
.slide.dark{background:var(--ink);color:var(--paper2)}
.kick{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--muted);margin-bottom:14px}
.dark .kick{color:var(--mutedk)}
h1{font-size:50px;line-height:1.24;font-weight:700;letter-spacing:-.5px}

h3{font-size:15px;font-weight:700;margin-bottom:9px}
p{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.dark p{color:var(--mutedk)}
.lead{font-size:17px;line-height:1.75;color:var(--ink2)}
.dark .lead{color:var(--mutedk)}
.sm{font-size:12.5px;line-height:1.68;color:var(--muted)}
.big{font-size:38px;line-height:1.36;font-weight:700}
.hot{color:var(--touch)} .cool{color:var(--vision)} .warm{color:var(--fast)}
.hotd{color:var(--touchdim)}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
.row{display:flex;gap:22px}
.row.g14{gap:14px}
.col{flex:1}

.card.warm{background:#FBEFD9}
.card.ink{background:var(--ink);color:var(--paper2)}
.card.ink p,.card.ink .sm{color:var(--mutedk)}
.card.sm{padding:17px 19px}
.glow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,90,54,.30) 0%,rgba(255,90,54,.10) 45%,rgba(255,90,54,0) 72%)}

.num{width:27px;height:27px;border-radius:50%;background:var(--touch);color:#fff;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.num.cool{background:var(--vision)} .num.warm{background:var(--fast)}
.num.gray{background:var(--paper3);color:var(--muted)}
.hd{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.hd h3{margin:0}
ul{list-style:none;margin-top:4px}
li{font-size:13px;line-height:1.62;color:var(--ink3);padding-left:15px;position:relative;margin-bottom:7px}
li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--paper3)}
li.h:before{background:var(--touch)} li.c:before{background:var(--vision)}
.dark li{color:var(--mutedk)}

  padding:16px 22px;margin-bottom:11px}

.band .bt .s{font-size:10.5px;color:var(--muted);margin-top:3px}
.band p{font-size:12.5px;line-height:1.66}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--muted);text-align:left;

td{font-size:12.5px;line-height:1.55;color:var(--ink3);padding:10px 10px 10px 0;

td.k{font-weight:700;color:var(--ink);width:24%}
td.off{color:var(--mutedk)}
td.act{font-weight:700;color:var(--touchdim)}
.bars{display:flex;gap:26px;margin-top:4px}
.bcol{flex:1}
.bcol .bl{font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:700}
.bar{border-radius:9px;display:flex;align-items:center;justify-content:center;

.step{flex:1;background:var(--paper2);border-radius:11px;padding:13px 11px;text-align:center}

.step .sv{font-size:12.5px;font-weight:700;line-height:1.45}

.eq{font-family:var(--mono);font-size:13px;background:var(--paper2);border-radius:9px;padding:12px 15px;color:var(--ink);margin:10px 0;line-height:1.65}

.ref:before{content:"▸";position:absolute;left:0;top:0;color:var(--paper3);font-size:9px}
.ref b{color:var(--ink3);font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:4px;background:var(--paper3);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.ok{background:#DFEAE4;color:#3D7355}
.tag.chk{background:#FAE3D8;color:var(--touchdim)}
.foot{font-size:11px;color:var(--mutedk);margin-top:auto;padding-top:14px}
#prog{position:fixed;left:0;bottom:0;height:3px;background:var(--touch);transition:width .22s;z-index:9}
#pg{position:fixed;right:15px;bottom:11px;font-size:11px;color:rgba(255,255,255,.5);

#mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:10;

#mnav button{width:56px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.14);
  color:#fff;font-size:22px;font-weight:700;line-height:1}
#mnav .t{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:1px}
@media (max-width:900px){

  .slide.dark div[style^="margin-top"]{margin-top:20px!important}
  #pg{display:none}
  #prog{top:0;bottom:auto}
  #mnav{display:flex}
  .kick{font-size:10px;letter-spacing:2px;margin-bottom:9px}
  h1{font-size:25px;line-height:1.3}
  h2{font-size:18.5px;line-height:1.35;margin-bottom:14px}
  h3{font-size:13.5px}
  p{font-size:13px;line-height:1.66}
  .lead{font-size:14px;line-height:1.66}
  .big{font-size:21px;line-height:1.42}
  .sm{font-size:12px;line-height:1.6}
  .ref{font-size:11px;line-height:1.52}
  .eq{font-size:12px;padding:10px 12px}
  .row,.row.g14{flex-direction:column;gap:10px}
  .band{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px}
  .band .bt{width:auto}
  .flow{flex-direction:column}
  .flow .arr{transform:rotate(90deg);width:100%;height:22px}
  .metric{flex-direction:column;gap:12px}
  .card{padding:14px 15px}
  .card.sm{padding:12px 13px}
  table{display:block;overflow-x:auto}
  th,td{font-size:11px;padding:7px 8px 7px 0}
}
@media print{
  html,body{background:#fff}
  #stage{position:static;display:block;overflow:visible}
  .slide{display:flex!important;position:relative;page-break-after:always;box-shadow:none;
    transform:none!important;margin:0}
  #prog,#pg{display:none}
}

<template id="deck">

<!-- 1 -->
<section class="slide dark">
  <div class="glow" style="width:640px;height:640px;right:-190px;top:-260px"></div>
  <div class="glow c" style="width:420px;height:420px;left:-170px;bottom:-190px"></div>
  <div class="kick">A 轮 · 机 器 人 触 觉 数 据</div>
  <div style="margin-top:130px">
    <h1>还没有人拥有的<br>那一层数据</h1>
    <p class="lead" style="margin-top:34px;max-width:790px">
      机器人已经能看懂一个厨房。但当它真的伸出手，<br>
      它需要的那一类数据，互联网上一条都没有。
    </p>
  </div>
  <div class="foot">本材料用于融资沟通，不含任何第三方未公开信息</div>
</section>

<!-- 2 -->
<section class="slide">
  <div class="kick">先 看 一 个 具 体 的 场 景</div>
  <h2>一个挤了洗洁精的盘子</h2>
  <div class="body">
    <div class="row">
      <div class="col" style="flex:1.15">
        <div class="card" style="margin-bottom:14px">
          <p>一个机器人准备和人一起洗盘子。学生刚挤好洗洁精，人接电话走了。你问它：「这有几个陶瓷餐具？」</p>
          <p style="margin-top:12px"><b class="cool">今天的视觉模型一秒就能答出「四个」。</b></p>
        </div>
        <div class="card hot">
          <p>你接着说：「帮我把它洗了。」</p>
          <p style="margin-top:12px">它伸出手，捏住盘子。瓷面涂了洗洁精，摩擦系数骤降。</p>
          <p style="margin-top:12px"><b class="hotd">盘子开始下滑。等到摄像头确认「盘子正在下落」，它已经在地上了。</b></p>
        </div>
      </div>
      <div class="col">
        <div class="card cool sm" style="margin-bottom:12px">
          <h3 class="cool">前半句，产业已经解决了</h3>
          <p class="sm">数物体、理解「它」指哪一个、拆解「洗干净」要做哪几步 —— 这些都发生在接触之前，由视觉和语言完成，已经基本收敛。</p>
        </div>
        <div class="card hot sm">
          <h3 class="hotd">后半句，还没有人解决</h3>
          <p class="sm">滑、滚、打转、捏碎、卡住、碰到人。这些全部发生在手接触物体之后的几十毫秒里，摄像头看不见，语言模型推不出来。</p>
        </div>
        <p class="sm" style="margin-top:14px">这条分界线，就是我们所在的位置。</p>
      </div>
    </div>
  </div>
</section>

<!-- 3 -->
<section class="slide dark">
  <div class="glow c" style="width:520px;height:520px;right:-180px;bottom:-230px"></div>
  <div class="kick">这 条 分 界 线 有 一 个 精 确 的 名 字</div>
  <div style="margin-top:96px">
    <div class="big">
      摄像头记录的是<span class="cool">运动学</span>：<br>
      东西移动到了哪里。
    </div>
    <div class="big" style="margin-top:38px">
      手感受到的是<span class="hot">力学</span>：<br>
      它为什么会移动，以及会不会滑掉。
    </div>
    <p class="lead" style="margin-top:44px;max-width:840px">
      互联网上有几十亿小时的视频，全部是前者。<br>
      后者，一条都没有 —— 因为它从来没有被任何一台摄像机记录过。
    </p>
  </div>
</section>

<!-- 4 -->
<section class="slide">
  <div class="glow" style="width:330px;height:330px;right:-130px;top:-130px"></div>
  <div class="kick">为 什 么 这 件 事 现 在 才 变 成 机 会</div>
  <h2>视觉这一层收敛了，瓶颈往后移了一格</h2>
  <div class="body">
    <div class="row">
      <div class="col">
        <div class="card cool">
          <div class="hd"><span class="num cool">1</span><h3 class="cool">2020 — 2024：看见</h3></div>
          <p class="sm">大模型解决了识别、指代、任务分解。业内的判断是，视觉已经解决了机器人感知世界「99%」的问题。这一层的竞争已经进入工程与成本阶段。</p>
        </div>
      </div>
      <div class="col">
        <div class="card warm">
          <div class="hd"><span class="num warm">2</span><h3 style="color:#B07A1C">2023 — 2026：动起来</h3></div>
          <p class="sm">动作模型（VLA）成为共识路线，机器人能把看见的东西转成动作。资本与人才在这一层高度密集，数据靠遥操作大规模采集。</p>
        </div>
      </div>
      <div class="col">
        <div class="card hot">
          <div class="hd"><span class="num">3</span><h3 class="hotd">现在：碰到</h3></div>
          <p class="sm">动作做出来了，但接触之后的一切仍然靠碰运气。行业开始意识到：把触觉直接塞进视觉模型，要么产生大量冗余，要么关键信息被淹没 —— 有团队反馈「一加触觉，原来的模型反而崩了」。</p>
        </div>
      </div>
    </div>
    <div class="card ink" style="margin-top:22px">
      <p style="font-size:16px;font-weight:700;color:var(--paper2)">
        每一次瓶颈后移，都会重新定价一层基础设施。<span class="hot">这一次后移到了接触。</span>
      </p>
      <p class="sm" style="margin-top:11px">
        而这一层与前两层有一个本质区别：前两层的数据可以从互联网上拿，或者用仿真生成；这一层的数据只能靠真实物理接触，一次一次采出来。
      </p>
    </div>
  </div>
</section>

<!-- 5 -->
<section class="slide">
  <div class="kick">这 一 层 到 底 缺 什 么</div>
  <h2>不是传感器不够好，是数据不存在</h2>
  <div class="body">
    <div class="row">
      <div class="col">
        <div class="card cool" style="height:100%">
          <h3 class="cool">硬件其实已经够用了</h3>
          <p class="sm" style="margin-top:2px">高分辨率的视触觉传感器已有十余年积累，能同时感知力度、位置、温度、材质、纹理、振动、滑动、碰撞。多光谱、摩擦电、惯性等路线都已验证。</p>
          <p class="sm" style="margin-top:14px"><b>但一个最好的传感器，不会自动产生智能。</b>行业里真实发生过的转折是：把传感器做到了很好的水平之后，发现智能并没有随之出现 —— 因为连训练它的数据都没有。</p>
        </div>
      </div>
      <div class="col" style="flex:1.1">
        <div class="card hot">
          <h3 class="hotd">而数据这一侧，是三个尚未解决的「跨」</h3>
          <ul style="margin-top:10px">
            <li class="h"><b>跨传感器</b> —— 同一批次产出的传感器性能都不完全一致，一个模型往往只能锚定某一种硬件</li>
            <li class="h"><b>跨模态</b> —— 力、温度、剪切、振动还没有一套与硬件无关的共同表征</li>
            <li class="h"><b>跨本体</b> —— 换一只手、换一台机器人，数据分布就变了</li>
          </ul>
          <p class="sm" style="margin-top:9px"><b class="hotd">跨本体的解法方向见第 16 页：</b>把数据的定义域从本体上移到场景上。</p>
        </div>
        <div class="card sm" style="margin-top:14px">
          <p class="sm">学术界近两年已经出现多个统一触觉表征的尝试，但公开基准的结论是：没有任何一个表征在所有任务上占优，且绝大多数工作仍局限在视触觉这一类硬件之间迁移。</p>
          <p class="sm" style="margin-top:10px"><b class="hotd">这三个「跨」全都是数据问题，不是算法问题。</b></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 6 -->
<section class="slide">
  <div class="kick">为 什 么 不 能 等 别 人 顺 手 做 掉</div>
  <h2>这层数据有三个让它无法被绕过的性质</h2>
  <div class="body">
    <div class="card ink" style="margin-bottom:15px;padding:14px 20px">
      <p style="font-size:15px;font-weight:700;color:var(--paper2)">
        根子上的原因只有一句：<span class="hot">物理属性只能通过一次真实交互的反馈被观测到。</span>
      </p>
      <p class="sm" style="margin-top:9px">
        几何是物体的外观，可以被静态拍下来；重量、摩擦、软硬、易碎是物体<b style="color:var(--paper2)">被作用时的行为</b>，必须先发生一次接触。这不是我们的一家之言 —— 视觉领域顶级实验室从 2015 年起<b style="color:var(--paper2)">连续十年</b>尝试「从视频反推物理属性」（Galileo、Physics 101、Visual De-animation、Physical Primitive Decomposition），每一篇的前提都是<b style="color:var(--paper2)">必须先观测到一次交互</b>，且结果只能给出粗粒度的标量估计。到 2024 年，同一条线上的最新工作（Spring-Gaus, ECCV 2024）开篇仍在承认：现有方法建模了外观与几何，<b style="color:var(--paper2)">但缺乏估计物体物理属性的能力</b>。
      </p>
    </div>
    <div class="row g14">
      <div class="col">
        <div class="card" style="height:100%">
          <div class="hd"><span class="num gray">1</span><h3>不能爬</h3></div>
          <p class="sm">图像和视频可以从互联网上取。接触力、剪切、滑移必须由一只真实的手压在一个真实的物体上产生。没有任何存量语料可以被清洗出来。</p>
        </div>
      </div>
      <div class="col">
        <div class="card" style="height:100%">
          <div class="hd"><span class="num gray">2</span><h3>不能纯靠仿真</h3></div>
          <p class="sm">仿真能给出几何与运动，但接触力学涉及材料、湿度、磨损、表面污染。洗洁精让瓷面摩擦系数骤降这类情况，恰恰是仿真最难标定的部分。</p>
        </div>
      </div>
      <div class="col">
        <div class="card" style="height:100%">
          <div class="hd"><span class="num gray">3</span><h3>不能事后补</h3></div>
          <p class="sm">运动学可以从录好的视频里反推。而一次接触的力分布如果当时没有被测量，就永久丢失了 —— 这一层的数据具有不可回溯性。</p>
        </div>
      </div>
    </div>

</template>

<script>
(function(){
  const tpl = document.getElementById('deck');
  const stage = document.getElementById('stage');
  Array.from(tpl.content.children).forEach(n => stage.appendChild(n.cloneNode(true)));
  const slides = Array.from(stage.querySelectorAll('.slide'));
  const prog = document.getElementById('prog');
  const pg = document.getElementById('pg');
  let i = 0;

  const isMobile = () => window.innerWidth <= 900;
  const mpg = document.getElementById('mpg');
  const mnav = document.getElementById('mnav');
  function fit(){
    if(isMobile()){ slides.forEach(sl => sl.style.transform = 'none'); return; }
    const s = Math.min(window.innerWidth/1280, window.innerHeight/720) * 0.965;
    slides.forEach(sl => sl.style.transform = 'scale('+s+')');
  }
  function show(n){
    i = Math.max(0, Math.min(slides.length-1, n));
    slides.forEach((sl,k) => sl.classList.toggle('on', k===i));
    prog.style.width = ((i+1)/slides.length*100)+'%';
    pg.textContent = (i+1) + ' / ' + slides.length;
    if(mpg) mpg.textContent = (i+1) + ' / ' + slides.length;
    if(isMobile()) window.scrollTo(0, 0);
  }
  if(mnav){
    document.getElementById('mprev').addEventListener('click', function(){ show(i-1); });
    document.getElementById('mnext').addEventListener('click', function(){ show(i+1); });
  }
  let _tx = null, _ty = null, _tbl = false;
  document.addEventListener('touchstart', function(e){
    _tx = e.touches[0].clientX; _ty = e.touches[0].clientY;
    _tbl = !!e.target.closest('table');
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(_tx === null) return;
    if(!_tbl){
      const dx = e.changedTouches[0].clientX - _tx;
      const dy = e.changedTouches[0].clientY - _ty;
      if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)*1.4) show(i + (dx < 0 ? 1 : -1));
    }
    _tx = null; _ty = null; _tbl = false;
  }, {passive:true});
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', e => {
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); show(i+1); }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); show(i-1); }
    else if(e.key==='Home'){ show(0); }
    else if(e.key==='End'){ show(slides.length-1); }
  });
  stage.addEventListener('click', e => show(i + (e.clientX < window.innerWidth*0.28 ? -1 : 1)));
  fit(); show(0);
})();
</script>
