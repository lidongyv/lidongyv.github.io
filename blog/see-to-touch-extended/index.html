<style>
:root{
  color-scheme: light;
  --ink:#14161A; --ink2:#1F2329; --ink3:#2B3138;
  --paper:#FFFFFF; --paper2:#F2F3F5; --paper3:#E6E8EB;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3A3D42;font-family:var(--sans);-webkit-font-smoothing:antialiased}

.slide{

}
.slide.on{display:flex}
.slide.dark{background:var(--ink);color:var(--paper2)}
.kick{font-size:11.5px;font-weight:700;letter-spacing:3px;color:var(--muted);margin-bottom:11px}
.dark .kick{color:var(--mutedk)}
h1{font-size:46px;line-height:1.24;font-weight:700;letter-spacing:-.5px}
h2{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.3px;margin-bottom:20px}
h3{font-size:14.5px;font-weight:700;margin-bottom:8px}
h4{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
p{font-size:13.5px;line-height:1.7;color:var(--ink2)}
.dark p{color:var(--mutedk)}
.lead{font-size:16px;line-height:1.72;color:var(--ink2)}
.dark .lead{color:var(--mutedk)}
.sm{font-size:12px;line-height:1.64;color:var(--muted)}
.xs{font-size:11px;line-height:1.58;color:var(--muted)}
.big{font-size:35px;line-height:1.36;font-weight:700}
.hot{color:var(--touch)} .cool{color:var(--vision)} .warm{color:var(--fast)}
.hotd{color:var(--touchdim)}
.body{flex:1;display:flex;flex-direction:column}
.row{display:flex;gap:18px}
.row.g12{gap:12px}
.col{flex:1}
.card{background:var(--paper2);border-radius:12px;padding:18px 20px}
.card.cool{background:#EAF1F4}
.card.hot{background:#FDEDE9}
.card.warm{background:#FBEFD9}

.card.ink p,.card.ink .sm,.card.ink .xs{color:var(--mutedk)}

.glow{position:absolute;border-radius:50%;pointer-events:none;

.glow.c{background:radial-gradient(circle,rgba(62,124,143,.28) 0%,rgba(62,124,143,.09) 45%,rgba(62,124,143,0) 72%)}
.num{width:25px;height:25px;border-radius:50%;background:var(--touch);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.num.cool{background:var(--vision)} .num.warm{background:var(--fast)}
.num.gray{background:var(--paper3);color:var(--muted)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hd h3{margin:0}
ul{list-style:none;margin-top:3px}
li{font-size:12.5px;line-height:1.6;color:var(--ink3);padding-left:14px;position:relative;margin-bottom:6px}
li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--paper3)}
li.h:before{background:var(--touch)} li.c:before{background:var(--vision)}

table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;color:var(--muted);text-align:left;

  border-bottom:1px solid var(--paper3);vertical-align:top}
td.k{font-weight:700;color:var(--ink);width:22%}
td.off{color:var(--mutedk)}
td.act{font-weight:700;color:var(--touchdim)}

.ref:before{content:"▸";position:absolute;left:0;top:0;color:var(--paper3);font-size:9px}
.ref b{color:var(--ink3);font-weight:700}
.ref .v{color:var(--mutedk)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:2px 7px;

.tag.ok{background:#DFEAE4;color:#3D7355}
.tag.chk{background:#FAE3D8;color:var(--touchdim)}

.step{flex:1;background:var(--paper2);border-radius:10px;padding:12px 10px;text-align:center}

.step .sl{font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:5px}

.bars{display:flex;gap:16px;align-items:flex-end}
.bcol{flex:1;display:flex;flex-direction:column;gap:7px}
.bl{font-size:12px;font-weight:700;margin-bottom:2px}

.foot{font-size:10.5px;color:var(--mutedk);margin-top:auto;padding-top:12px}
#prog{position:fixed;left:0;bottom:0;height:3px;background:var(--touch);transition:width .22s;z-index:9}
#pg{position:fixed;right:15px;bottom:11px;font-size:11px;color:rgba(255,255,255,.5);z-index:9}

#mnav .t{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:1px}

  h2{font-size:18.5px;line-height:1.35;margin-bottom:14px}
  h3{font-size:13.5px}
  h4{font-size:11px}
  p{font-size:13px;line-height:1.66}
  .lead{font-size:14px;line-height:1.66}
  .big{font-size:21px;line-height:1.42}
  .sm{font-size:12px;line-height:1.6}
  .xs{font-size:11px;line-height:1.55}

}
</style>

    </p>
    <p class="sm" style="margin-top:26px;color:#5A6068">

    </p>

<!-- 2 -->
<section class="slide">
  <div class="kick">这 份 材 料 的 结 构</div>
  <h2>四个技术问题，一条线索</h2>
  <div class="body">
    <div class="row">
      <div class="col">
        <div class="card cool" style="height:100%">
          <div class="hd"><span class="num cool">1</span><h3 class="cool">世界怎么被写成可推演的形式</h3></div>
          <p class="sm">组合式抽象、符号谓词与神经网络的分工、前置/后置条件的自动发现、点云轨迹验证。</p>
          <p class="xs" style="margin-top:9px">P3 — P6</p>
        </div>
      </div>
      <div class="col">
        <div class="card cool" style="height:100%">
          <div class="hd"><span class="num cool">2</span><h3 class="cool">先验从哪来</h3></div>
          <p class="sm">关节物体运动学先验的条件 VAE 建模，以及把 2D 扩散先验蒸馏到 3D/4D 表示的 SDS 路线。</p>
          <p class="xs" style="margin-top:9px">P7 — P9</p>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="col">
        <div class="card hot" style="height:100%">
          <div class="hd"><span class="num">3</span><h3 class="hotd">为什么接触这一层补不上</h3></div>
          <p class="sm">物理属性只能由交互反馈观测到；触觉是这个反问题的另一端 —— <b>而这条线自己从 2018 年起就已经在伸手去碰</b>。以及 hold 谓词的时间性缺陷、三层架构、跨传感器表征、评测缺口。</p>
          <p class="xs" style="margin-top:9px">P10 — P24</p>
        </div>
      </div>
      <div class="col">
        <div class="card hot" style="height:100%">
          <div class="hd"><span class="num">4</span><h3 class="hotd">数据应该怎么被采出来</h3></div>
          <p class="sm">采集方法的本末倒置、数据锚定场景而非设备、行为拆分为 meta action、VLA 按 meta action 重构、做中学的商业闭环。</p>
          <p class="xs" style="margin-top:9px">P25 — P30</p>
        </div>
      </div>
    </div>
    <div class="card ink" style="margin-top:18px">
      <p style="font-size:15px;font-weight:700;color:var(--paper2)">
        贯穿全篇的线索：<span class="cool">世界表示</span>这件事被做得越来越完整，
        但它始终写的是<span class="cool">几何与运动</span>；<span class="hot">接触力学</span>不是它的低分辨率版本，而是一个正交的量。
      </p>
    </div>
    <p class="sm" style="margin-top:14px">每个技术点给出：做法 → 关键设计 → <b>失效条件</b>。失效条件是这份材料最值得讨论的部分。</p>
  </div>
</section>

<!-- 3 -->
<section class="slide">
  <div class="kick">问 题 一 · 世 界 表 示</div>
  <h2>组合式抽象：符号负责组合，网络负责世界</h2>
  <div class="body">
    <div class="flow">
      <div class="step"><div class="sl">输 入</div><div class="sv">图像 / 视频<br>语言指令</div></div>
      <div class="arr">→</div>
      <div class="step"><div class="sl">基 础 模 型</div><div class="sv">感知<br>语言理解</div></div>
      <div class="arr">→</div>
      <div class="step on"><div class="sl">组 合 式 抽 象</div><div class="sv">原子技能<br>谓词集合</div></div>
      <div class="arr">→</div>
      <div class="step"><div class="sl">规 划</div><div class="sv">技能串联<br>+ 验证器</div></div>
      <div class="arr">→</div>
      <div class="step"><div class="sl">输 出</div><div class="sv">动作</div></div>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num cool">S</span><h3>状态 States</h3></div>
          <p class="xs">二元谓词，由网络验证而非人工判定。<span style="font-family:var(--mono)">is_dirty(x)</span>、<span style="font-family:var(--mono)">on(A,B)</span>。验证器是一个分类网络或直接调用 VLM。</p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num cool">A</span><h3>动作 Actions</h3></div>
          <p class="xs">原子技能，带前置与后置条件。<span style="font-family:var(--mono)">wash(x)</span> 要求 <span style="font-family:var(--mono)">hold(x)</span> ∧ <span style="font-family:var(--mono)">faucet_on</span>，效果是 <span style="font-family:var(--mono)">¬is_dirty(x)</span>（若表面有洗洁精）。</p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num cool">R</span><h3>关系 Relations</h3></div>
          <p class="xs">「是这套符号化的类型定义了组合性，而由网络来处理感知与控制。」符号层只回答「什么能接在什么后面」。</p>
        </div>
      </div>
    </div>
    <div class="card cool" style="margin-top:16px">
      <h4 class="cool" style="margin-bottom:6px">这套设计解决的核心问题</h4>
      <p class="sm">纯神经策略无法做长程组合泛化；纯符号规划器无法泛化到新场景。把组合性交给符号、把感知与控制交给网络，是当前长程操作任务的主流折衷。它允许「推演」：前置条件满足 → 执行 → 后置效果成立 → 下一步真正被允许做什么。</p>
    </div>
  </div>
</section>

<!-- 4 -->
<section class="slide">
  <div class="kick">问 题 一 · 关 键 设 计</div>
  <h2>前置条件不是手写的，是被发现的</h2>
  <div class="body">
    <div class="row">
      <div class="col" style="flex:1.05">
        <div class="card hot">
          <p style="font-size:14px"><b class="hotd">「如果所有这些东西都是手工编码的，那它就退化成了传统的规划系统，而那是无法泛化的。」</b></p>
          <p class="sm" style="margin-top:11px">于是问题变成：你怎么知道 <span style="font-family:var(--mono)">hold</span> 是 <span style="font-family:var(--mono)">wash</span> 的前置条件？答案是这些同样由网络发现。</p>
        </div>
        <div class="card" style="margin-top:13px">
          <h4>整条链路的学习分工</h4>
          <ul>
            <li class="c">哪些属性值得被表示 —— 基础模型生成假设</li>
            <li class="c">哪些属性构成前置/后置条件 —— 网络生成</li>
            <li class="c">某个状态此刻是否成立 —— 网络验证</li>
            <li class="c">具体怎么动 —— 网络给出控制策略</li>
          </ul>
        </div>
      </div>
      <div class="col">
        <div class="card cool" style="height:100%">
          <h4 class="cool">参考工作 · 算子学习谱系</h4>

            八年后同一问题仍在：原文开篇即指出「现有方法（如 3D Gaussians）建模了外观与几何，<b>但缺乏估计物体物理属性的能力</b>」—— 必须再嵌一个弹簧质点模型，并且仍然<b>要多视角视频里那段真实运动</b>才能拟合。</div>
        </div>
      </div>
      <div class="col">
        <div class="card" style="margin-bottom:10px">
          <h4>五篇工作的公共结构</h4>
          <div class="eq" style="font-size:11.5px">
施加/观察一次交互 a<br>
　　↓<br>
读取反馈 Δ（运动变化 / 接触读数）<br>
　　↓<br>
反演物理属性 θ = {m, μ, k, …}
          </div>
          <p class="xs" style="margin-top:7px">没有任何一篇是从<b>静态图像</b>直接读出质量或摩擦的 —— 因为原理上做不到。几何是物体的<b>外观</b>，物理属性是物体<b>在被作用时的行为</b>。</p>
        </div>
        <div class="card hot sm">
          <h4 class="hotd">而这条线的三个结构性限制</h4>
          <ul style="margin-top:4px">
            <li class="h">只能<b>被动观测别人的交互</b>，不能在自己的操作回路里实时用</li>
            <li class="h">强依赖物理引擎的参数化，刚体+库仑摩擦之外难标定</li>
            <li class="h">只能反演<b>粗粒度标量</b>（μ ≈ 0.3），不是接触面上随时间变化的力分布</li>
          </ul>
          <p class="xs" style="margin-top:7px">这三条不是实现问题，是<b>把仪器放在远端</b>的必然代价 —— 下一页给出直接的解法。</p>
        </div>
      </div>
    </div>
  </div>
</section>

    </div>

        <div class="step" style="background:#FBE0D8"><div class="sl">交 互</div><div class="sv">盘子被握、被抬</div></div>

        <div class="step" style="background:#F7C7B8"><div class="sl">正 向 读 数</div><div class="sv">不需要反演<br>不需要物理引擎</div></div>

      <p>滑落、碰撞、失衡的那一毫秒。不经过任何符号验证，不等待任何规划重写 —— 因为符号验证本身来不及（见第 5 页的延迟预算）。</p>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="col">
        <div class="card sm">
          <p class="xs"><b>分层判据：</b>延迟与信息丰富度的权衡。「脊髓追求极致的快，不要求信息特别丰富；快脑需要更丰富的多模态信息；慢脑更多负责思考和理解。」</p>
        </div>
      </div>
      <div class="col">
        <div class="card hot sm">
          <p class="xs"><b class="hotd">同一种触觉，两种角色：</b>在快脑里让机器人<b>做得更好</b>，在脊髓里让机器人<b>来得及</b>。这意味着同一份数据要同时服务两类模型，对采样率与标注粒度提出了不同要求 —— 这是采集体系设计的关键约束。</p>
        </div>
      </div>
    </div>
  </div>
</section>

      <p class="xs" style="margin-top:8px"><b>我们内部该问的：</b>一个「脊髓层基准」应该长什么样？候选指标：滑动检测延迟、碰撞后卸力时间、握力闭环的稳态误差、以及<b>反射介入后长程任务的成功率保持度</b>（见第 24 页开放问题二）。</p>
      <p class="xs" style="margin-top:8px"><b class="hotd">方向（配合第 28 页优先级）：</b>需要统一的不是行业标准，而是<b>定制可衡量的评测空间</b> —— 不是端到端的评测，而是对 action 进行 <b>meta 元素细分</b>：拆到 meta action 级去测抓取稳定性、接触反馈、完成时间、速度剖面，而不是只报一个端到端成功率。</p>
    </div>
  </div>
</section>

        「重要的不是行为，而是场景」—— 模型的知识应该组织在<span class="cool">场景 × meta action</span>上，而不是组织在<span class="hot">设备 × 轨迹</span>上。后者会让每一代新硬件都重新变成「没见过的分布」。
      </p>
      <p class="sm" style="margin-top:9px">对接触层的含义：meta action 的接触反馈 f 与后验 s′ 正是第 10—13 页那一栏缺失的数据 —— 按 meta action 组织，这一栏第一次有了可以积累的结构。</p>
      <p class="sm" style="margin-top:9px"><b style="color:var(--paper2)">优先级判断：</b>meta action 的拆分与 VLA 重构，这个的优先级<b>大于评测、大于硬件、大于数采</b>。需要统一的不是行业标准，而是<b>定制可衡量的评测空间</b> —— 不是端到端的评测，而是对 action 进行 meta 元素细分。</p>
    </div>
  </div>
</section>

  <h2>量不够，不见真相 —— 硬件、软件、数据都还有问题</h2>
  <div class="body">
    <div class="row g12">
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num gray">硬</span><h3>硬件</h3></div>
          <p class="xs">传感器一致性、漂移、跨传感器标定仍未收敛（第 19—20 页）。「哪怕都是视触觉传感器，同一批次生产出来的性能都可能不完全一样。」<span class="tag ok">丁文伯访谈</span></p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num gray">软</span><h3>软件</h3></div>
          <p class="xs">触觉表征未收敛，触觉 × VLA 的融合方式未定（第 15、21 页）；「一加触觉，原来的 VLA 反而崩了」是业内常被提到的现象。<span class="tag ok">丁文伯访谈</span></p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num gray">数</span><h3>数据</h3></div>
          <p class="xs">量不够、绑定设备、没有交互结构（第 25—28 页）。四者互相放大：硬件的问题暴露在数据里，数据的问题暴露在模型里，模型的问题暴露在场景里。</p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="height:100%">
          <div class="hd"><span class="num gray">T</span><h3>时间与速度</h3></div>
          <p class="xs">现有采集忽略了 T 的存在：在一些高速运作场景下，机体会产生不受控制的震动和惯性，对设备本身是极大的损耗；「该用什么速度移动」是现在无法采集的信号。</p>
        </div>
      </div>
    </div>
    <div class="row g12" style="margin-top:13px">
      <div class="col" style="flex:1.12">
        <div class="card cool sm" style="height:100%">
          <h4 class="cool">两则可核对的旁证（2026）</h4>
          <div class="ref"><b>丁文伯</b>（DeepTech 访谈，2026-08）：「我坚信触觉领域存在 scaling law，但单纯增加数据量可能并不是关键突破口。」<span class="tag ok">已核实</span><br>
          解读：<b>量是必要条件，量的结构才是充分条件</b> —— 无结构的量（绑定设备的轨迹）堆再多也见不到真相。</div>
          <div class="ref"><b>吴佳俊</b>（ECCV 2026 演讲 Q&amp;A）：「我认为我们的表示其实是相当统一的……（难的在于）统一的表示到底是什么？如何把它表示出来？以及怎么才能得到它？」<span class="tag ok">已核实 · 据演讲整理</span><br>
          解读：「怎么得到」只有一个答案 —— 量。而斯坦福为 BEHAVIOR 挑战赛采 3000 小时演示已经花了「相当可观的一笔钱」：<b>连顶级学术机构都被采集成本压着，采集只能靠任务收入养。</b></div>
        </div>
      </div>
      <div class="col" style="flex:0.9">
        <div class="card hot" style="height:100%">
          <h4 class="hotd">所以做中学不是姿态，是唯一解</h4>
          <p class="xs">先遥操把任务做完（商业闭环、赚钱）→ 数据末端应用量提高 → 正确的 meta action 浮现 → 硬件设计得到迭代信号 → 任务做得更快更好 → 数据更多。<b>每一圈都在攒同一份资产：场景 × meta action × 接触反馈。</b></p>
          <p class="xs" style="margin-top:9px">反过来的顺序（先采集、再卖设备）在经济学上不可持续 —— 采集成本没有任何收入可以摊薄，量必然上不去，真相必然出不来。</p>
          <p class="xs" style="margin-top:9px"><b class="hotd">Scale-up 的判据：</b>不是堆叠数据量，而是堆叠应用多样性和实际完成的任务。</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 30 -->
<section class="slide">
  <div class="kick">问 题 四 · 核 心 主 张 原 文</div>
  <h2>六条主张，原文照录 —— 不省略，不更改</h2>
  <div class="body">
    <div class="row g12">
      <div class="col">
        <div class="card sm" style="margin-bottom:10px">
          <div class="hd"><span class="num">1</span><h3>具身数据要做中学</h3></div>
          <p class="xs">「可以让 agent 执行前，首先需要让遥操实行 —— 这里的遥操执行指的不是采集数据，而是直接执行任务并且商业闭环。在这个 ready 前，数据采集和遥操采集都是扯淡。现在的采集忽略了 T 的存在：在一些高速运作场景下，机体会产生不受控制的震动和惯性，对设备本身是极大的损耗，该用什么速度移动是现在无法采集的信号。</p>
          <p class="xs" style="margin-top:6px">具身现在的数据采集方法是错的。做中学应该先商业闭环：先完成任务赚钱，在任务中迭代 meta action 和设备；而不是现在这样盲目地用特定设备采集然后卖设备 —— 这是本末倒置的商业模式，是强迫大家用不正确的通用设备、低效率完成特定任务的商业模式。应当在现在的各类设备中设计通用 meta action，在快速正确完成任务的基础上实现数据采集。只有先用遥操把任务完成之后，才可能把数据末端应用量提高，才可以在这个基础上得到正确的 meta action，以及迭代硬件设备的设计上。」</p>
        </div>
        <div class="card sm" style="margin-bottom:10px">
          <div class="hd"><span class="num">2</span><h3>数据不应该绑定具身设备</h3></div>
          <p class="xs">「绑定某一家的设备采集是没有意义的。真正重要的数据，不是人形机器人采集的那些关键点数据，而是环境数据、交互数据。一个场景可以被 100 种设备使用。绑定设备的数据走不远 —— 具身短期内不可能出现垄断公司，没可能像 CUDA 一样。」</p>
        </div>
        <div class="card sm">
          <div class="hd"><span class="num">3</span><h3>行为上应该区分移动和关键物体交互</h3></div>
          <p class="xs">「目前 locomotion、interaction 两个任务已经分开，但是还有很多具体任务区分得非常僵硬，尤其是在居家环境中的 locomotion。」</p>
        </div>
      </div>
      <div class="col">
        <div class="card sm" style="margin-bottom:10px">
          <div class="hd"><span class="num">4</span><h3>拆分通用交互方式：meta action 与 VLA 重构</h3></div>
          <p class="xs">「目前的 top 问题是需要拆分通用的交互方式：设备执行的是 meta action，录制的数据也应该拆分为 meta action；VLA 也一样，需要重新根据 meta action 进行重构。这个的优先级大于评测、大于硬件、大于数采。需要统一的不是行业标准，而是定制可衡量的评测空间 —— 不是端到端的评测，而是对 action 进行 meta 元素细分。」</p>
        </div>
        <div class="card sm" style="margin-bottom:10px">
          <div class="hd"><span class="num">5</span><h3>重要的不是行为，而是场景</h3></div>
          <p class="xs">「数据 view 下，重要的不是行为而是场景 —— 这是一个跟现在的 VLA 以及 LLM 直接存在的巨大 gap。」</p>
        </div>
        <div class="card hot">
          <div class="hd"><span class="num">6</span><h3 class="hotd">硬件、软件、数据都有问题；量不够不见真相</h3></div>
          <p class="xs">「现在的硬件、软件、数据都存在问题，量不够不见真相。scale up 始终没有做起来 —— 不是堆叠数据量，而是堆叠应用多样性和实际完成的任务。完成任务不是遥操加速十倍让机器执行：这种 formulation 会让机器人永远无法 scale up 到多样化的应用中，从最底层的硬件设计和实现上已经是不 make sense 的。只有在不考虑工作效率和泛化的前提下，目前的慢动作遥操才是合理的。」</p>
        </div>
      </div>
    </div>
    <p class="xs" style="margin-top:8px">以上六条为创始人对数据方法论的原始表述，原样收录（仅补标点与更正拼写），是本材料第 25—29 页全部展开的依据，属本材料自有主张。</p>
  </div>
</section>

<script>
(function(){
  const tpl = document.getElementById('deck');
  const stage = document.getElementById('stage');
  Array.from(tpl.content.children).forEach(n => stage.appendChild(n.cloneNode(true)));
  const slides = Array.from(stage.querySelectorAll('.slide'));
  const prog = document.getElementById('prog');
  const pg = document.getElementById('pg');
  let i = 0;

  const isMobile = () => window.innerWidth <= 900;
  const mpg = document.getElementById('mpg');
  const mnav = document.getElementById('mnav');
  function fit(){
    if(isMobile()){ slides.forEach(sl => sl.style.transform = 'none'); return; }
    const s = Math.min(window.innerWidth/1280, window.innerHeight/720) * 0.965;
    slides.forEach(sl => sl.style.transform = 'scale('+s+')');
  }
  function show(n){
    i = Math.max(0, Math.min(slides.length-1, n));
    slides.forEach((sl,k) => sl.classList.toggle('on', k===i));
    prog.style.width = ((i+1)/slides.length*100)+'%';
    pg.textContent = (i+1) + ' / ' + slides.length;
    if(mpg) mpg.textContent = (i+1) + ' / ' + slides.length;
    if(isMobile()) window.scrollTo(0, 0);
  }
  if(mnav){
    document.getElementById('mprev').addEventListener('click', function(){ show(i-1); });
    document.getElementById('mnext').addEventListener('click', function(){ show(i+1); });
  }
  let _tx = null, _ty = null, _tbl = false;
  document.addEventListener('touchstart', function(e){
    _tx = e.touches[0].clientX; _ty = e.touches[0].clientY;
    _tbl = !!e.target.closest('table');
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(_tx === null) return;
    if(!_tbl){
      const dx = e.changedTouches[0].clientX - _tx;
      const dy = e.changedTouches[0].clientY - _ty;
      if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)*1.4) show(i + (dx < 0 ? 1 : -1));
    }
    _tx = null; _ty = null; _tbl = false;
  }, {passive:true});
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', e => {
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); show(i+1); }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); show(i-1); }
    else if(e.key==='Home'){ show(0); }
    else if(e.key==='End'){ show(slides.length-1); }
  });
  stage.addEventListener('click', e => show(i + (e.clientX < window.innerWidth*0.28 ? -1 : 1)));
  fit(); show(0);
})();
</script>
