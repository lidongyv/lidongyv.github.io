<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#5f6d7b"/></marker></defs>
<style>
  .box{fill:#ffffff;stroke:#0b6bcb;stroke-width:1.6;rx:10}
  .box2{fill:#e8f2fc;stroke:#0b6bcb;stroke-width:1.6;rx:10}
  .warn{fill:#fdf3e0;stroke:#c99a3e;stroke-width:1.4;rx:10}
  .t{font:13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2430}
  .tb{font:bold 13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#0b2a4a}
  .s{font:11.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#5f6d7b}
  .a{stroke:#5f6d7b;stroke-width:1.4;fill:none;marker-end:url(#arr)}
</style>
<rect x="0" y="0" width="960" height="310" fill="#fbfcfe"/>

<text x="24" y="34" class="tb">GigaBrain RAMP：四阶段数据流</text>
<rect x="24" y="60" width="150" height="62" class="box"/><text x="40" y="82" class="t">真机 episode</text><text x="40" y="100" class="s">o, p, a, l, success</text><text x="40" y="116" class="s">4K 小时</text>
<rect x="206" y="60" width="120" height="62" class="box"/><text x="222" y="82" class="t">VAE 编码</text><text x="222" y="100" class="s">z_t / z_future</text>
<rect x="358" y="60" width="150" height="62" class="box2"/><text x="374" y="82" class="t">世界模型 flow</text><text x="374" y="100" class="s">Eq.7 预测未来潜</text>
<rect x="540" y="60" width="120" height="62" class="box"/><text x="556" y="82" class="t">价值头</text><text x="556" y="100" class="s">v_t（Eq.5 训练）</text>
<rect x="692" y="60" width="120" height="62" class="box"/><text x="708" y="82" class="t">优势</text><text x="708" y="100" class="s">A_t（Eq.8）</text>
<rect x="844" y="60" width="96" height="62" class="box"/><text x="860" y="82" class="t">二值化</text><text x="860" y="100" class="s">I_t=1[A&gt;ε]</text>
<rect x="540" y="176" width="400" height="62" class="box2"/><text x="556" y="198" class="t">策略损失（Eq.3）</text><text x="556" y="216" class="s">−logπ(a|o,z,l) − α·logπ(a|I,o,z,l)</text>
<rect x="206" y="176" width="260" height="62" class="warn"/><text x="222" y="198" class="t">HILR 采集</text><text x="222" y="216" class="s">自主执行 + 人接管（去边界伪影）</text>
<rect x="24" y="176" width="120" height="62" class="warn"/><text x="40" y="198" class="t">Stage 4</text><text x="40" y="216" class="s">联合续训</text>
<line x1="174" y1="91" x2="204" y2="91" class="a"/><line x1="326" y1="91" x2="356" y2="91" class="a"/>
<line x1="508" y1="91" x2="538" y2="91" class="a"/><line x1="660" y1="91" x2="690" y2="91" class="a"/>
<line x1="812" y1="91" x2="842" y2="91" class="a"/>
<line x1="892" y1="122" x2="892" y2="174" class="a"/><line x1="892" y1="207" x2="942" y2="207" class="a"/>
<line x1="540" y1="207" x2="468" y2="207" class="a"/><line x1="206" y1="207" x2="146" y2="207" class="a"/>
<line x1="84" y1="176" x2="84" y2="124" class="a"/>
<text x="24" y="272" class="s">Stage 1–2：世界模型 + 价值（Eq.5/7/8）→ 优势二值化 → Eq.3 加权 NLL；Stage 3：HILR 采边界样本；</text>
<text x="24" y="292" class="s">Stage 4：世界模型与策略在 HILR+base 上联合续训，防止优势坍缩（A→0）。</text>

</svg>