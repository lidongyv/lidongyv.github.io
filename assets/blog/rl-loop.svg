<rect x="196" y="58" width="150" height="54" class="box"/><text x="212" y="80" class="t">奖励信号</text><text x="212" y="98" class="s">5 类代理信号</text>
<rect x="378" y="58" width="150" height="54" class="box"/><text x="394" y="80" class="t">G 条 rollout</text><text x="394" y="98" class="s">同条件采样</text>
<rect x="560" y="58" width="160" height="54" class="box"/><text x="576" y="80" class="t">组归一化优势</text><text x="576" y="98" class="s">无 critic</text>
<rect x="752" y="58" width="160" height="54" class="box"/><text x="768" y="80" class="t">截断代理更新</text><text x="768" y="98" class="s">clip(ρ)</text>
<rect x="560" y="170" width="160" height="54" class="warn"/><text x="576" y="192" class="t">闭环数据</text><text x="576" y="210" class="s">失败/干预/恢复</text>
<rect x="196" y="170" width="150" height="54" class="box"/><text x="212" y="192" class="t">SFT 迭代</text><text x="212" y="210" class="s">重新训练/微调</text>
<line x1="164" y1="85" x2="194" y2="85" class="a"/><line x1="346" y1="85" x2="376" y2="85" class="a"/>
<line x1="528" y1="85" x2="558" y2="85" class="a"/><line x1="720" y1="85" x2="750" y2="85" class="a"/>
<line x1="832" y1="112" x2="832" y2="197" class="a"/><line x1="832" y1="197" x2="722" y2="197" class="a"/>
<line x1="558" y1="197" x2="348" y2="197" class="a"/><line x1="196" y1="197" x2="160" y2="197" class="a"/>
<line x1="160" y1="197" x2="160" y2="114" class="a"/>
<text x="24" y="270" class="s">说明：奖励信号可以由世界模型价值 / IDM 平滑度 / LTL 验证 / 专家潜距离 / 稀疏成功标签提供；</text>
