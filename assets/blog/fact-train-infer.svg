<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#5f6d7b"/></marker></defs>
<style>
  .box{fill:#ffffff;stroke:#0b6bcb;stroke-width:1.6;rx:10}
  .box2{fill:#e8f2fc;stroke:#0b6bcb;stroke-width:1.6;rx:10}
  .warn{fill:#fdf3e0;stroke:#c99a3e;stroke-width:1.4;rx:10}
  .t{font:13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2430}
  .tb{font:bold 13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#0b2a4a}
  .s{font:11.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#5f6d7b}
  .a{stroke:#5f6d7b;stroke-width:1.4;fill:none;marker-end:url(#arr)}
</style>
<rect x="0" y="0" width="960" height="290" fill="#fbfcfe"/>

<text x="24" y="34" class="tb">FACT：训练（左）与两阶段推理（右）</text>
<rect x="24" y="60" width="150" height="58" class="box"/><text x="40" y="82" class="t">成功演示</text><text x="40" y="100" class="s">动作可模仿</text>
<rect x="24" y="136" width="150" height="58" class="warn"/><text x="40" y="158" class="t">失败 rollout</text><text x="40" y="176" class="s">动作掩码，后果保留</text>
<rect x="206" y="60" width="170" height="58" class="box2"/><text x="222" y="82" class="t">动作损失 L_a</text><text x="222" y="100" class="s">Eq.8（成功）</text>
<rect x="206" y="136" width="170" height="58" class="warn"/><text x="222" y="158" class="t">动作项剔除</text><text x="222" y="176" class="s">Eq.9（失败）</text>
<rect x="406" y="60" width="190" height="58" class="box"/><text x="422" y="82" class="t">价值/未来损失</text><text x="422" y="100" class="s">Eq.6 目标，全样本</text>
<rect x="406" y="136" width="190" height="58" class="box"/><text x="422" y="158" class="t">token 掩码</text><text x="422" y="176" class="s">V/I 只看干净动作 G</text>
<rect x="636" y="60" width="130" height="58" class="box"/><text x="652" y="82" class="t">Stage 1</text><text x="652" y="100" class="s">出动作</text>
<rect x="636" y="136" width="130" height="58" class="box2"/><text x="652" y="158" class="t">Stage 2</text><text x="652" y="176" class="s">填干净动作→价值</text>
<rect x="806" y="98" width="130" height="58" class="box"/><text x="822" y="120" class="t">best-of-N</text><text x="822" y="138" class="s">Eq.10 选最高价值</text>
<line x1="174" y1="89" x2="204" y2="89" class="a"/><line x1="174" y1="165" x2="204" y2="165" class="a"/>
<line x1="376" y1="89" x2="404" y2="89" class="a"/><line x1="376" y1="165" x2="404" y2="165" class="a"/>
<line x1="596" y1="89" x2="634" y2="89" class="a"/><line x1="596" y1="165" x2="634" y2="165" class="a"/>
<line x1="766" y1="127" x2="804" y2="127" class="a"/>
<text x="24" y="252" class="s">训练：成功样本学动作+价值+未来；失败样本只学价值+未来（动作被掩码）。</text>
<text x="24" y="272" class="s">推理：Stage 1 只出动作（动作单用）；需要评估时进 Stage 2，用干净动作条件化价值/未来，再用 Eq.10 选候选。</text>

</svg>