<svg xmlns="http://www.w3.org/2000/svg" width="860" height="714" viewBox="0 0 860 714" font-family="Microsoft YaHei, Segoe UI, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5b6a79"/></marker></defs>
<rect width="860" height="714" fill="#ffffff"/>
