<text x="126" y="412" font-size="11.5" fill="#5b6a79">A_t=Σγ^k r+γ^n v−v；I_t=1[A_t&gt;ε]</text>
<line x1="430" y1="338" x2="430" y2="366" stroke="#5b6a79" stroke-width="1.6" marker-end="url(#a)"/>
