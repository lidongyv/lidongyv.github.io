<text x="126" y="500" font-size="11.5" fill="#5b6a79">−logπ(a|o,z,l) − α logπ(a|I,o,z,l)</text>
<line x1="430" y1="426" x2="430" y2="454" stroke="#5b6a79" stroke-width="1.6" marker-end="url(#a)"/>
